# Merge this entry into the EXISTING /etc/ansible/hosts on ansible-master.
# Replace NODE2_PRIVATE_IP with ansible-node2's private IP.
# Use the SSH username and key already configured in class.
# Keep other existing inventory hosts and groups.
[test]
ansible-node2 ansible_host=NODE2_PRIVATE_IP ansible_ssh_user=ansible_user

# Optional, only if the existing class SSH setup needs these overrides:
#[test:vars]
#ansible_ssh_private_key_file=/absolute/path/to/class-key.pem
#ansible_python_interpreter=/usr/bin/python3
